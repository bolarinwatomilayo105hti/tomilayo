<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact LINKORA</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header><a class="logo" href="index.html">L <span>LINKORA<small>BY TOMILAYO</small></span></a><button
            class="menu">☰</button>
        <nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a
                href="seller.html">Sell with us</a><a href="contact.html">Contact</a></nav>
    </header>
    <main class="page form-page"><small>LET'S CONNECT</small>
        <h1>We'd love to <em>hear from you.</em></h1>
        <p>Questions about a product, seller registration or the marketplace? Send a message.</p>
        <form id="contactform"><label>Your name<input required placeholder="Full name"></label><label>Email
                address<input type="email" required placeholder="you@example.com"></label><label>Topic<select>
                    <option>General enquiry</option>
                    <option>Product question</option>
                    <option>Seller registration</option>
                    <option>Partnership</option>
                </select></label><label>Message<textarea required
                    placeholder="How can we help?"></textarea></label><button class="btn">Send message ↗</button>
            <p id="contactmsg"></p>
        </form><small>Demo form only; messages are not sent or saved.</small>
    </main>
    <footer><a href="index.html">LINKORA · Tomilayo</a><a href="shop.html">Shop</a></footer>
    <script src="script.js"></script>
</body>

</html>
